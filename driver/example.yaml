apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: veth-demo
spec:
  devices:
    requests:
      - name: network
        exactly:
          deviceClassName: veth
          allocationMode: ExactCount
          count: 1
    config:
      - requests: [network]
        opaque:
          driver: veth.dra.example.com
          parameters:
            interfaceName: net1
            mtu: 1500
            podAddress: 192.0.2.2/30
            hostAddress: 192.0.2.1/30
---
apiVersion: v1
kind: Pod
metadata:
  name: veth-demo
spec:
  resourceClaims:
    - name: network
      resourceClaimName: veth-demo
  containers:
    - name: demo
      image: busybox:1.37
      command: [sh, -c, "sleep 86400"]
      resources:
        claims:
          - name: network